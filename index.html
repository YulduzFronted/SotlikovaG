<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasbiy Ta'lim Menejmenti</title>
    <!-- Telegram WebApp rasmiy kutubxonasi -->
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; color: #222; margin: 0; padding: 15px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h1 { font-size: 19px; text-align: center; color: #1a365d; margin-top: 0; margin-bottom: 5px; }
        .author { text-align: center; font-size: 13px; color: #718096; margin-bottom: 20px; }
        select, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 15px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; }
        button { background-color: #2481cc; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #1c66a3; }
        .question { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .question-text { font-size: 15px; font-weight: 600; line-height: 1.5; margin-top: 0; margin-bottom: 12px; }
        .options label { display: block; background: #fff; border: 1px solid #cbd5e0; padding: 12px; margin: 8px 0; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .options label:hover { background: #ebf8ff; border-color: #bee3f8; }
        .options input[type="radio"] { margin-right: 8px; transform: scale(1.1); }
        .result { font-size: 16px; font-weight: bold; text-align: center; color: #2481cc; margin-top: 15px; padding: 10px; background: #ebf8ff; border-radius: 6px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Kasbiy Ta'lim Menejmenti</h1>
    <div class="author">Tuzuvchi: <strong>Xundiboyev Murodjon</strong></div>
    
    <label for="topicSelect"><strong>Mavzuni tanlang:</strong></label>
    <select id="topicSelect" onchange="loadQuestions()">
        <option value="">-- Mavzuni tanlang --</option>
        <option value="1">1-mavzu: Strategik rejalashtirish</option>
        <option value="2">2-mavzu: Boshqaruv va KPI tizimi</option>
    </select>

    <div id="quizArea" style="display: none;">
        <div id="questionsContainer"></div>
        <button onclick="checkAnswers()">Natijani tekshirish</button>
        <div id="resultArea" style="display: none;" class="result"></div>
    </div>
</div>

<script>
// Telegram WebApp interfeysini kengaytirish
if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.expand();
}

const testDatabase = {
    "1": [
        {
            q: "Mehnat bozori tahlili natijalarini muassasada strategik qarorlar qabul qilish jarayoniga transformatsiya qilish bosqichlarining toʻgʻri ketma-ketligini aniqlang:\n1. Tashqi soʻrovlar va statistika orqali empirik maʼlumotlarni yigʻish\n2. Yangi kasbiy koʻnikmalar shakllanishi boʻyicha oʻquv natijalarini monitoring qilish\n3. Aniqlangan ehtiyojlarni qondirish uchun muassasa resurslarini baholash\n4. Dasturlarni yangilash yoki resurslarni maqsadli yoʻnaltirish boʻyicha qaror qabul qilish",
            a: ["A) 1, 3, 4, 2", "B) 1, 4, 3, 2", "C) 3, 1, 4, 2", "D) 3, 4, 1, 2"],
            correct: 0
        },
        {
            q: "Kasbiy taʼlim tashkilotining strategik asoslari va ularning mantiqiy-boshqaruv funksiyalarini moslashtiring:\n1. Missiya, 2. Vizion, 3. Asosiy qadriyatlar\nTa'riflar:\nX. Kelajak tasavvuri boʻlib, tashkilotning uzoq muddatda qanday yakuniy natijaga erishishini ifodalaydi.\nY. Muassasa nima sababdan mavjudligi va kimlar uchun qanday qiymat yaratishini koʻrsatadi.\nZ. Boshqaruv qarorlari va jamoa faoliyatida amal qilinadigan muhim prinsiplardir.",
            a: ["A) 1-Y, 2-X, 3-Z", "B) 1-X, 2-Y, 3-Z", "C) 1-Y, 2-Z, 3-X", "D) 1-Z, 2-X, 3-Y"],
            correct: 0
        },
        {
            q: "Muassasada avtomobillarga texnik xizmat koʻrsatish yoʻnalishi mavjud, biroq hududda elektromobillar tez surʼatda koʻpaymoqda, ustaxona jihozlari va pedagoglar malakasi esa mos emas. Strategik boshqaruvga koʻra rahbar birinchi navbatda qanday tizimli chora koʻrishi lozim?",
            a: [
                "A) Servis korxonalari ehtiyojini oʻrganish, dasturlarni yangilash, pedagoglarni qayta tayyorlash va jihozlarni rejalashtirish",
                "B) Mavjud darslar oʻz vaqtida oʻtilishini taʼminlash va joriy oʻquv rejasini oʻzgarishsiz qoldirish",
                "C) Elektromobillar yoʻnalishiga qabul kvotalarini yopish va anʼanaviy dars soatlarini koʻpaytirish",
                "D) Muammoning yechimini korxonalar zimmasiga yuklab, faqat nazariy taʼlim shakliga oʻtish"
            ],
            correct: 0
        }
    ],
    "2": [
        {
            q: "Sifatli KPI tizimini 'yuqoridan pastga' mantiqiy zanjir asosida shakllantirish va uni boshqaruv qaroriga integratsiya qilish bosqichlarining toʻgʻri ketma-ketligini aniqlang:\n1. Ustuvor vazifalarni belgilash va KPI koʻrsatkichlarini tanlash\n2. Muassasa missiyasi va uzoq muddatli strategik maqsadlarini aniq deklaratsiya qilish\n3. Maʼlumot manbalari asosida tizimli monitoring yuritish va tahliliy qaror qabul qilish\n4. Koʻrsatkichlarning boshlangʻich (baseline) hamda maqsadli (target) qiymatlarini shakllantirish",
            a: ["A) 2, 1, 4, 3", "B) 2, 4, 1, 3", "C) 1, 2, 4, 3", "D) 1, 4, 2, 3"],
            correct: 0
        },
        {
            q: "Kasbiy taʼlim tashkilotida oʻquv yili yakunida bitiruvchilarning bandlik darajasi belgilangan target koʻrsatkichidan past ekanligi aniqlandi. Tizimli jarayonli yondashuv modelidan kelib chiqib, rahbar ushbu muammoning tub sababini aniqlash uchun birinchi navbatda qaysi boshqaruv qarorini qabul qilishi lozim?",
            a: [
                "A) Muammoni faqat karyera markazi faoliyati bilan bogʻlamasdan, oʻquv dasturi mazmuni hamda amaliyot sifatini tahlil qilish",
                "B) Karyera xizmati boʻlimi xodimlarining barchasiga nisbatan intizomiy jazo choralarini qoʻllash toʻgʻrisida buyruq rasmiylashtirish",
                "C) Bandlik koʻrsatkichlarini sunʼiy yaxshilash maqsadida bitiruvchilarning faqat telefon soʻrovlari natijalarini hisobotga kiritish",
                "D) Muassasani rivojlantirish dasturidan bandlik koʻrsatkichini chiqarib tashlash va faqat oʻquvchilar davomati nazoratini kuchaytirish"
            ],
            correct: 0
        },
        {
            q: "Tezis: Muassasa samaradorligini faqat moliyaviy xarajatlarni kamaytirish yoki bajarilgan ishlar sonini koʻpaytirish bilan baholash mutlaqo yetarli emas.\nMulohaza: Kasbiy taʼlimda sifat, bitiruvchilar bandligi, oʻquvchi va ish beruvchi qoniqishi boshqaruvning ijtimoiy va iqtisodiy qiymatini ifodalaydi.",
            a: [
                "A) Tezis ham, mulohaza ham toʻgʻri, ular oʻrtasida mantiqiy bogʻliqlik bor",
                "B) Tezis ham, mulohaza ham toʻgʻri, ammo mantiqiy bogʻliqlik yoʻq",
                "C) Tezis toʻgʻri, mulohaza notoʻgʻri",
                "D) Tezis notoʻgʻri, mulohaza toʻgʻri"
            ],
            correct: 0
        }
    ]
};

function loadQuestions() {
    const topicId = document.getElementById("topicSelect").value;
    const quizArea = document.getElementById("quizArea");
    const container = document.getElementById("questionsContainer");
    const resultArea = document.getElementById("resultArea");
    
    resultArea.style.display = "none";
    resultArea.innerHTML = "";
    
    if (!topicId || !testDatabase[topicId]) {
        quizArea.style.display = "none";
        return;
    }
    
    quizArea.style.display = "block";
    container.innerHTML = "";

    testDatabase[topicId].forEach((item, qIndex) => {
        let qHtml = `<div class="question"><p class="question-text"><strong>${qIndex + 1}. ${item.q}</strong></p><div class="options">`;
        item.a.forEach((option, oIndex) => {
            qHtml += `<label><input type="radio" name="q${qIndex}" value="${oIndex}"> ${option}</label>`;
        });
        qHtml += `</div></div>`;
        container.innerHTML += qHtml;
    });
}

function checkAnswers() {
    const topicId = document.getElementById("topicSelect").value;
    const questions = testDatabase[topicId];
    let score = 0;
    let answeredCount = 0;

    questions.forEach((item, qIndex) => {
        const selected = document.querySelector(`input[name="q${qIndex}"]:checked`);
        if (selected) {
            answeredCount++;
            if (parseInt(selected.value) === item.correct) {
                score++;
            }
        }
    });

    if (answeredCount < questions.length) {
        alert("Iltimos, barcha savollarga javob bering!");
        return;
    }

    const resultArea = document.getElementById("resultArea");
    resultArea.style.display = "block";
    resultArea.innerHTML = `Natija: Siz ${questions.length} ta murakkab savoldan ${score} tasiga toʻgʻri javob berdingiz!`;
}
</script>
</body>
</html>
