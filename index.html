<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasbiy Ta'lim Menejmenti</title>
    <!-- Telegram WebApp uchun rasmiy skript -->
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--tg-theme-bg-color, #f4f4f9); color: var(--tg-theme-text-color, #222); margin: 0; padding: 15px; }
        .card { background: var(--tg-theme-secondary-bg-color, #fff); padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h1 { font-size: 20px; text-align: center; color: #1a365d; margin-top: 0; }
        .author { text-align: center; font-size: 13px; color: #718096; margin-bottom: 20px; }
        select, button { width: 100%; padding: 12px; margin: 10px 0; font-size: 15px; border-radius: 8px; border: 1px solid #cbd5e0; box-sizing: border-box; }
        button { background-color: #2481cc; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #1c66a3; }
        .question { background: var(--tg-theme-bg-color, #f8fafc); border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .options label { display: block; background: var(--tg-theme-secondary-bg-color, #fff); border: 1px solid #cbd5e0; padding: 10px; margin: 6px 0; border-radius: 6px; cursor: pointer; }
        .result { font-size: 16px; font-weight: bold; text-align: center; color: #2481cc; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Kasbiy Ta'lim Menejmenti</h1>
    <div class="author">Tuzuvchi: <strong>Xundiboyev Murodjon</strong></div>
    
    <label for="topicSelect"><strong>Mavzuni tanlang (38 ta mavzu):</strong></label>
    <select id="topicSelect" onchange="loadQuestions()">
        <option value="">-- Mavzuni tanlang --</option>
        <option value="1">1-mavzu: Kasbiy amaliyot asoslari</option>
        <option value="2">2-mavzu: Xalqaro hamkorlik va qoʻshma dasturlar</option>
        <!-- Qolgan 3-38 gacha mavzular shu yerga tartib bilan qo'shiladi -->
    </select>

    <div id="quizArea" style="display: none;">
        <div id="questionsContainer"></div>
        <button onclick="checkAnswers()">Natijani tekshirish</button>
        <div id="resultArea" class="result"></div>
    </div>
</div>

<script>
// Telegram WebApp ni ishga tushirish
const tg = window.Telegram.WebApp;
tg.expand(); // Oynani to'liq ekranga ochish

// Akademik darajadagi test savollari bazasi
const testDatabase = {
    "1": [
        {
            q: "Tinglovchining kasbiy amaliyot davomida muassasani rivojlantirish dasturi uchun material toʻplash bosqichlari boshlangʻich trayektoriyasini aniqlang:",
            a: ["Amaliy topshiriqlarni bajarish rejasini shakllantirish", "Faqat moliyaviy audit xulosalarini tekshirish", "O'qituvchilarning darsga kelish davomatini yuritish"],
            correct: 0
        }
    ],
    "2": [
        {
            q: "Vazirlar Mahkamasining 614-sonli qaroriga muvofiq, qo'shma ta'lim dasturlarida mutaxassislik fanlarining minimal xalqaro ulushi qancha bo'lishi qonuniy shart hisoblanadi?",
            a: ["Kamida 25 foizi xorijiy hamkor dasturi asosida bo'lishi", "Kamida 50 foizi xorijiy hamkor dasturi asosida bo'lishi", "To'liq 100 foiz xalqaro dasturga o'tkazilishi"],
            correct: 0
        }
    ]
        "2": [
        // I. KETMA-KETLIKNI ANIQLASH TESTLARI
        {
            q: "Sifatli KPI tizimini 'yuqoridan pastga' mantiqiy zanjir asosida shakllantirish va uni boshqaruv qaroriga integratsiya qilish bosqichlarining toʻgʻri ketma-ketligini aniqlang:\n1. Ustuvor vazifalarni belgilash va ular uchun oʻlchanadigan KPI koʻrsatkichlarini tanlash\n2. Muassasa missiyasi hamda uzoq muddatli strategik maqsadlarini aniq deklaratsiya qilish\n3. Maʼlumot manbalari asosida tizimli monitoring yuritish va tahliliy boshqaruv qarorini qabul qilish\n4. Koʻrsatkichlarning boshlangʻich (baseline) hamda maqsadli (target) qiymatlarini shakllantirish",
            a: [
                "2, 1, 4, 3",
                "2, 4, 1, 3",
                "1, 2, 4, 3",
                "1, 4, 2, 3"
            ],
            correct: 0
        },
        {
            q: "Uzluksiz takomillashtirish modeliga (PDCA sikli) muvofiq, kasbiy taʼlim tashkilotida KPI koʻrsatkichlari ogʻishini optimallashtirish va boshqarish jarayonlarining mantiqiy tartibini koʻrsating:\n1. Aniqlangan tahlil natijalari asosida konkret amaliy tuzatishlarni kiritish (Act)\n2. Davlat taʼlim standartlari va mezonlar asosida strategik rejani shakllantirish (Plan)\n3. Rejalashtirilgan vazifalarni oʻquv-tarbiya va boshqaruv amaliyotida bajarish (Do)\n4. KPI vositalari yordamida erishilgan koʻrsatkichlarni tekshirish va tahlil qilish (Check)",
            a: [
                "2, 3, 4, 1",
                "2, 4, 3, 1",
                "3, 2, 4, 1",
                "3, 4, 2, 1"
            ],
            correct: 0
        },
        {
            q: "KPI tizimini muassasaga joriy etish va oʻzgarishlarni boshqarish yoʻl xaritasining dastlabki bosqichlari xronologiyasini belgilang:\n1. Har bir koʻrsatkich uchun KPI pasporti, masʼul shaxs va maʼlumot manbasini tasdiqlash\n2. Strategik ustuvorliklardan kelib chiqib, 3–5 ta asosiy KPI bilan pilot loyihani boshlash\n3. Tashkilot darajasidagi koʻrsatkichlarni boʻlim va xodim darajasiga kaskadlashni yakunlash\n4. Xodimlarga yangi baholash metodikasini hamda tizimning rivojlanish vositasi ekanligini tushuntirish",
            a: [
                "2, 3, 1, 4",
                "3, 2, 1, 4",
                "2, 1, 3, 4",
                "3, 1, 2, 4"
            ],
            correct: 0
        },
        {
            q: "Muassasa rahbarining har choraklik '3–3–3' boshqaruv tahlili algoritmini amalga oshirish zanjirini aniqlang:\n1. Aniqlangan jiddiy tafovutlar boʻyicha ustuvor tuzatuvchi chora-tadbirlarni belgilash\n2. Muassasa faoliyatida erishilgan eng yuqori va ijobiy boʻlgan 3 ta natijani tahlil qilish\n3. Reja va fakt oʻrtasida yuzaga kelgan 3 ta eng katta salbiy tafovutni (gap) identifikatsiya qilish\n4. Har bir tuzatuvchi chora boʻyicha masʼul, muddat, resurs va kutilayotgan KPI oʻzgarishini tasdiqlash",
            a: [
                "2, 3, 1, 4",
                "2, 1, 3, 4",
                "3, 2, 1, 4",
                "3, 1, 2, 4"
            ],
            correct: 0
        },

        // II. MOSLASHTIRISH TESTLARI
        {
            q: "Boshqaruv modellari va ularning kasbiy taʼlim tashkilotidagi bosh mezonlarini moslashtiring:\n1. Natijaga yoʻnaltirilgan boshqaruv\n2. Jarayonlarga asoslangan boshqaruv\n3. Maʼlumotlarga asoslangan boshqaruv\nTa'riflar:\nX. Tashkilot faoliyatini ketma-ket zanjirlar (qabul-ta'lim-amaliyot-bandlik) sifatida koʻradi.\nY. Qarorlarni subyektiv xulosalar bilan emas, tekshiriladigan koʻrsatkichlar kombinatsiyasi bilan almashtiradi.\nZ. Asosiy eʼtiborni bajarilgan ishlar miqdoriga emas, tizimda yaratilgan real oʻzgarishga qaratadi.",
            a: [
                "1-Z, 2-X, 3-Y",
                "1-X, 2-Z, 3-Y",
                "1-Z, 2-Y, 3-X",
                "1-Y, 2-X, 3-Z"
            ],
            correct: 0
        },
        {
            q: "Koʻrsatkichlar turlari va ularning metodologik taʼriflarini muvofiqlashtiring:\n1. Statistik maʼlumot\n2. Natija indikatori (Lagging)\n3. Yetaklovchi indikator (Leading)\nTa'riflar:\nX. Kelajakdagi natijaga taʼsir etuvchi jarayon yoki faoliyatning holatini oldindan koʻrsatadi.\nY. Faoliyat yakunida shakllangan yakuniy holatni yoki erishilgan aniq marrani ifodalaydi.\nZ. Tashkilotning mavjud holatini tavsiflaydi, biroq boshqaruv qarori uchun KPI vazifasini bajarmaydi.",
            a: [
                "1-Z, 2-Y, 3-X",
                "1-Y, 2-Z, 3-X",
                "1-Z, 2-X, 3-Y",
                "1-X, 2-Y, 3-Z"
            ],
            correct: 0
        },
        {
            q: "RACI matritsasi elementlari va ularning javobgarlik doiralarini moslashtiring:\n1. Responsible (R)\n2. Accountable (A)\n3. Consulted (C)\nTa'riflar:\nX. Muayyan vazifa yoki topshiriqni bevosita amaliyotda bajaruvchi xodim.\nY. Ishni amalga oshirish jarayonida oʻz professional maslahatlari va ekspertizasi bilan ishtirok etuvchi subyekt.\nZ. Muayyan faoliyatning yakuniy natijasi va uning strategik samaradorligi uchun toʻliq javobgar shaxs.",
            a: [
                "1-X, 2-Z, 3-Y",
                "1-X, 2-Y, 3-Z",
                "1-Z, 2-X, 3-Y",
                "1-Y, 2-Z, 3-X"
            ],
            correct: 0
        },
        {
            q: "Maʼlumotlar sifati mezonlari va ularning verifikatsiya talablarini moslashtiring:\n1. Aniqik\n2. Izchillik\n3. Tekshiriluvchanlik\nTa'riflar:\nX. Turli davrlar va boʻlinmalar koʻrsatkichlarni bir xil metodika asosida oʻlchashini ifodalaydi.\nY. Maʼlumotlarning boshlangʻich manbasini va hisoblash formulasini qayta tekshirish imkoniyatini bildiradi.\nZ. Yigʻilgan koʻrsatkichlarning tashkilotdagi real holatni toʻgʻri va xatosiz aks ettirish darajasidir.",
            a: [
                "1-Z, 2-X, 3-Y",
                "1-X, 2-Z, 3-Y",
                "1-Z, 2-Y, 3-X",
                "1-Y, 2-X, 3-Z"
            ],
            correct: 0
        },
        {
            q: "Boshqaruv tahlili instrumentlari va ularning amaliy vazifalarini muvofiqlashtiring:\n1. KPI pasporti\n2. Dashboard\n3. Tafovut (Gap)\nTa'riflar:\nX. Rejalashtirilgan maqsadli qiymat bilan amaldagi erishilgan natija oʻrtasidagi farq koʻrsatkichidir.\nY. KPI nomi, formulasi, oʻlchov birligi, masʼuli va monitoring mexanizmi aks ettiriladigan rasmiy hujjat.\nZ. Asosiy koʻrsatkichlarning holatini, rejasini va dinamikasini bir qarashda koʻrsatadigan vizual panel.",
            a: [
                "1-Y, 2-Z, 3-X",
                "1-Z, 2-Y, 3-X",
                "1-Y, 2-X, 3-Z",
                "1-X, 2-Z, 3-Y"
            ],
            correct: 0
        },

        // III. VAZIYATLI (KEYS) TESTLARI
        {
            q: "Kasbiy taʼlim tashkilotida oʻquv yili yakunida bitiruvchilarning bandlik darajasi belgilangan target koʻrsatkichidan past ekanligi aniqlandi. Tizimli jarayonli yondashuv modelidan kelib chiqib, rahbar ushbu muammoning tub sababini aniqlash uchun birinchi navbatda qaysi boshqaruv qarorini qabul qilishi lozim?",
            a: [
                "Muammoni faqat karyera markazi faoliyati bilan bogʻlamasdan, oʻquv dasturi mazmuni hamda ishlab chiqarish amaliyoti sifatini tahlil qilish",
                "Karyera xizmati boʻlimi xodimlarining barchasiga nisbatan intizomiy jazo choralarini qoʻllash toʻgʻrisida buyruq rasmiylashtirish",
                "Bandlik koʻrsatkichlarini sunʼiy yaxshilash maqsadida bitiruvchilarning faqat telefon soʻrovlari natijalarini hisobotga kiritish",
                "Muassasani rivojlantirish dasturidan bandlik koʻrsatkichini chiqarib tashlash va faqat oʻquvchilar davomati nazoratini kuchaytirish"
            ],
            correct: 0
        },
        {
            q: "Muassasada joriy etilgan yangi KPI tizimi monitoring qilinganda, pedagog xodimlarda koʻrsatkichlarni sunʼiy ravishda yaxshilash, real maʼlumotlarni yashirish hamda tizimni 'jazolash instrumenti' sifatida qabul qilish tendensiyasi kuzatildi. Ushbu tashkiliy qarshilik va destruktiv holatni bartaraf etish uchun eng optimal yechim qaysi?",
            a: [
                "Tizimning maqsadi jazolash emas, balki ustuvorliklarni aniqlash va resurslarni toʻgʻri yoʻnaltirish ekanligini tushuntirish, metodikani ochiq qilish",
                "KPI koʻrsatkichlarini yanada murakkablashtirish va maʼlumotlar xavfsizligini taʼminlash uchun nazoratchi auditorlar shtatini koʻpaytirish",
                "Pedagog kadrlarning norasmiy eʼtirozlarini inobatga olib, muassasada KPI tizimi asosida baholash mexanizmlarini toʻliq bekor qilish",
                "Koʻrsatkichlari past boʻlgan barcha pedagog xodimlarning oylik ustamalari hamda moddiy ragʻbatlantirish miqdorlarini avtomatik ravishda kesish"
            ],
            correct: 0
        },
        {
            q: "Direktor oʻrinbosari uchun strategik KPI sifatida 'bitiruvchilar bandligini 85 foizga yetkazish' koʻrsatkichi belgilangan. Biroq, bandlik koʻrsatkichiga hududiy mehnat bozori kononiyatlari va bitiruvchining shaxsiy omillari kabi xodim nazorat qilolmaydigan tashqi faktorlar ham taʼsir koʻrsatadi. Kaskadlash tamoyillariga koʻra ushbu koʻrsatkich qanday muvozanatlanishi shart?",
            a: [
                "Yakuniy natija koʻrsatkichi bilan birgalikda, xodimning bevosita taʼsir doirasidagi yetaklovchi (leading) indikatorlarni ham belgilash",
                "Tashqi omillarning taʼsirini toʻliq inobatga olmasdan, xodimdan faqat 85 foizlik yakuniy target koʻrsatkichining ijrosini talab qilish",
                "Masʼuliyatning tarqalishini oldini olish uchun ushbu strategik koʻrsatkichni muassasadagi barcha pedagog xodimlarga teng ulushda taqsimlash",
                "Bandlik koʻrsatkichi oʻrniga faqat bajarilgan seminarlar va oʻtkazilgan karyera kunlari soni kabi statistik maʼlumotlarni kiritish"
            ],
            correct: 0
        },
        {

    // 38-mavzugacha shu tartibda ob'ekt ichida davom etadi...
};

function loadQuestions() {
    const topicId = document.getElementById("topicSelect").value;
    const quizArea = document.getElementById("quizArea");
    const container = document.getElementById("questionsContainer");
    const resultArea = document.getElementById("resultArea");
    
    resultArea.innerHTML = "";
    if (!topicId || !testDatabase[topicId]) {
        quizArea.style.display = "none";
        return;
    }
    
    quizArea.style.display = "block";
    container.innerHTML = "";

    testDatabase[topicId].forEach((item, qIndex) => {
        let qHtml = `<div class="question"><p><strong>${qIndex + 1}. ${item.q}</strong></p><div class="options">`;
        item.a.forEach((option, oIndex) => {
            qHtml += `<label><input type="radio" name="q${qIndex}" value="${oIndex}"> ${option}</label>`;
        });
        qHtml += `</div></div>`;
        container.innerHTML += qHtml;
    });
}

function checkAnswers() {
    const topicId = document.getElementById("topicSelect").value;
    const questions = testDatabase[topicId];
    let score = 0;

    questions.forEach((item, qIndex) => {
        const selected = document.querySelector(`input[name="q${qIndex}"]:checked`);
        if (selected && parseInt(selected.value) === item.correct) {
            score++;
        }
    });

    document.getElementById("resultArea").innerHTML = `Natija: ${questions.length} ta savoldan ${score} ta to'g'ri.`;
    
    // Telegramga qisqa tebranish effekti berish (Haptic Feedback)
    if (tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred("success");
    }
}
</script>
</body>
</html>
